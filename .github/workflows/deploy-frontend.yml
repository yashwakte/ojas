name: Test and Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "ojas-frontend/**"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ojas-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./ojas-frontend
        run: npm ci

      # google-chrome-stable ships preinstalled on ubuntu-latest, but karma-chrome-launcher
      # doesn't always find it by auto-detection - pointing CHROME_BIN at it directly is the
      # reliable way. ChromeHeadlessCI (karma.conf.js) adds --no-sandbox, required to launch
      # Chrome at all under the runner's restricted execution environment.
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(which google-chrome-stable)" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: ./ojas-frontend
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      # From here on: Vercel's own documented GitHub Actions recipe. Git-based auto-deploy is
      # disconnected in the Vercel dashboard, so nothing else can put a build into production -
      # this workflow is the only path, and only after the test step above has succeeded.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: ./ojas-frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build via Vercel
        working-directory: ./ojas-frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        working-directory: ./ojas-frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
