<!doctype html>

    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <!-- THERE IS DELIBERATELY NO HERO PRELOAD HERE ANY MORE.

         There used to be one, for /images/hero-banner-1280.webp, and its reasoning was sound while
         the hero was a fixed picture in the bundle: the browser cannot discover the largest paint
         on the home page until Angular has booted and rendered the home route, so naming it in the
         markup bought the whole cost of that bootstrap.

         It stopped being true the moment the owner published hero slides of their own. Verified
         against production on 2026-09-07: /api/hero-slides returns two admin-uploaded slides, so
         the shipped poster is not what anybody sees, and the preload was fetching ~190KB of a
         picture that is never drawn - on EVERY page load, product pages and checkout included,
         competing for bandwidth with the image that actually is the largest paint. A preload of
         the wrong file is worse than no preload at all.

         What replaces it: the first hero slide's <img> already carries fetchpriority="high" and a
         srcset (see home-hero.html), and /api/media responses are now cacheable at Vercel's edge
         (see MediaController), so the real picture is prioritised the moment it is known and comes
         from the edge rather than from the API instance.

         If the hero ever goes back to being a fixed picture in the bundle, a preload of that file
         belongs here again. Doing better than that for managed slides needs the first slide's URL
         to be known at document-serve time, which means server-rendering this file - a bigger
         change than it is worth today. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Phone verification pulls the MSG91 widget, which in turn pulls hCaptcha from two further
         origins. Left to discover themselves, those are three cold DNS+TLS handshakes happening
         at the exact moment the customer is waiting on a "Send code" button. dns-prefetch rather
         than preconnect for the hCaptcha pair: only a fraction of visitors ever register, and a
         held-open connection to an origin most of them never use is a cost on every page. -->
    <link rel="preconnect" href="https://verify.msg91.com" />
    <link rel="dns-prefetch" href="https://newassets.hcaptcha.com" />
    <link rel="dns-prefetch" href="https://hcaptcha.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- Styles the noscript fallback only. Inline rather than in the stylesheet because the app's
         CSS is a separate request that a reader with no JavaScript will never make. -->
    <style>
      .boot-shell {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
        font-family: 'Poppins', 'Roboto', system-ui, sans-serif;
        color: #3a2f28;
        line-height: 1.7;
      }
      .boot-logo {
        display: block;
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .boot-shell h1 {
        font-size: 1.4rem;
      }
      .boot-shell a {
        color: #b3541e;
      }
    </style>
  </head>
  <body>
    <!-- Deliberately empty. An earlier version put the business description inside app-root, where
         it rendered as a wall of unstyled text for the few hundred milliseconds before Angular
         booted - a poor first impression on every single visit.

         The noscript block below achieves the same thing without that cost. Its content is present
         in the HTML as served, so anything that does not execute JavaScript still reads it -
         crawlers, link previewers, and the payment gateway's compliance check that previously
         rejected this domain as "inactive / not live" for having a literally empty body. A browser
         with JavaScript on never renders it, so a real customer sees only the app.

         Do not "simplify" this away: without it the served HTML has zero visible text again. -->
    <app-root></app-root>

    <noscript>

        <span class="boot-logo">ओजस्</span>

          across Pune in 1–2 days.
        </p>

        </p>

          <!-- A literal @, not the &#64; entity used in Angular templates (where @ starts control

      </div>
    </noscript>
  </body>
</html>
