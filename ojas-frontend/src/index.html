<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ojas - शुद्ध आहार...शुद्ध विचार</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ojas - Premium quality flours and healthy food products. शुद्ध आहार...शुद्ध विचार"
    />
    <meta name="theme-color" content="#F25A1A" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <!-- The home page hero, started before Angular has parsed a line of JavaScript. Without
         this the browser cannot discover the image until the app has booted and rendered the
         home route, which pushes the largest paint back by the whole cost of that bootstrap.
         imagesrcset must mirror the <picture> in home.html or the preload fetches a file the
         page then does not use. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-banner-1280.webp"
      imagesrcset="/images/hero-banner-640.webp 640w, /images/hero-banner-960.webp 960w, /images/hero-banner-1280.webp 1280w, /images/hero-banner-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Phone verification pulls the MSG91 widget, which in turn pulls hCaptcha from two further
         origins. Left to discover themselves, those are three cold DNS+TLS handshakes happening
         at the exact moment the customer is waiting on a "Send code" button. dns-prefetch rather
         than preconnect for the hCaptcha pair: only a fraction of visitors ever register, and a
         held-open connection to an origin most of them never use is a cost on every page. -->
    <link rel="preconnect" href="https://verify.msg91.com" />
    <link rel="dns-prefetch" href="https://newassets.hcaptcha.com" />
    <link rel="dns-prefetch" href="https://hcaptcha.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- Styles the noscript fallback only. Inline rather than in the stylesheet because the app's
         CSS is a separate request that a reader with no JavaScript will never make. -->
    <style>
      .boot-shell {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
        font-family: 'Poppins', 'Roboto', system-ui, sans-serif;
        color: #3a2f28;
        line-height: 1.7;
      }
      .boot-logo {
        display: block;
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .boot-shell h1 {
        font-size: 1.4rem;
      }
      .boot-shell a {
        color: #b3541e;
      }
    </style>
  </head>
  <body>
    <!-- Deliberately empty. An earlier version put the business description inside app-root, where
         it rendered as a wall of unstyled text for the few hundred milliseconds before Angular
         booted - a poor first impression on every single visit.

         The noscript block below achieves the same thing without that cost. Its content is present
         in the HTML as served, so anything that does not execute JavaScript still reads it -
         crawlers, link previewers, and the payment gateway's compliance check that previously
         rejected this domain as "inactive / not live" for having a literally empty body. A browser
         with JavaScript on never renders it, so a real customer sees only the app.

         Do not "simplify" this away: without it the served HTML has zero visible text again. -->
    <app-root></app-root>

    <noscript>
      <div class="boot-shell">
        <span class="boot-logo">ओजस्</span>
        <h1>Ojas — pure flours and traditional food products</h1>
        <p>
          Ojas is an online shop selling stone-ground atta, millet flours, besan, daliya and
          custard powders, milled and packed in Pune. Ojas is a brand owned and operated by Asha
          Marketing, a licensed food business under FSSAI, and we deliver across Pune in 1–2 days.
        </p>
        <p>
          This shop needs JavaScript to run. Please enable it, or contact us directly and we will
          take your order:
        </p>
        <p>
          Phone: <a href="tel:+918657781526">+91 8657781526</a><br />
          <!-- A literal @, not the &#64; entity used in Angular templates (where @ starts control
               flow). This file is plain HTML, and a crawler reading the raw source should find a
               real address rather than an escape sequence. -->
          Email: <a href="mailto:wecare@ojasaata.com">wecare@ojasaata.com</a><br />
          Asha Marketing, Near Chhatrapati Shivaji Maharaj Udyan, Madhuban Society Lane No. 9,
          Old Sanghvi, Pune – 411027, Maharashtra, India
        </p>
        <p>
          <a href="/contact">Contact Us</a> ·
          <a href="/terms">Terms and Conditions</a> ·
          <a href="/refunds">Refunds and Cancellations</a> ·
          <a href="/privacy">Privacy Policy</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
