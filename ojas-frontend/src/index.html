<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The home page's title and description, and what every page carries until the app has
         started. KEEP IN STEP WITH HOME_SEO in src/app/constants/seo.ts, which SeoService applies
         once it runs. A link previewer (WhatsApp, Instagram) never runs it, so for a shared link
         these lines ARE the preview. There is deliberately no canonical tag here: this file is
         served for every address, and SeoService sets the right one per page. -->
    <title>Ojas Aata – Stone-Ground Atta, Modak Peeth &amp; Upwas Flours in Pune</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    />
    <meta name="theme-color" content="#F25A1A" />
    <meta property="og:site_name" content="Ojas" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Ojas Aata – Stone-Ground Atta, Modak Peeth &amp; Upwas Flours in Pune"
    />
    <meta
      property="og:description"
      content="Ojas (ओजस्) makes chakki-fresh jowar, bajra, ragi and rice flour, modak peeth, anarase pith and upwas flours in Pune since 2007. Order online, delivered in 1–2 days."
    />
    <meta property="og:image" content="https://www.ojasaata.com/images/hero-banner-framed-1280.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The Ojas range of flours and food products" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Who Ojas is, for Google: the shop (with its return policy, declared once for every
         product) and the website (so results show the site name "Ojas"). A data block, not a
         script - it is never executed, so the CSP's script-src does not apply to it. The address,
         phone and return window must match business.ts and the Refunds page. Delivery pricing is
         deliberately absent: Google can only describe an Indian delivery area by country and
         state, and delivery here is by distance within Pune. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "OnlineStore",
            "@id": "https://www.ojasaata.com/#organization",
            "name": "Ojas",
            "alternateName": ["Ojas Aata", "ओजस्"],
            "legalName": "Asha Marketing",
            "url": "https://www.ojasaata.com/",
            "logo": "https://www.ojasaata.com/images/logo.png",
            "image": "https://www.ojasaata.com/images/hero-banner-framed-1280.jpg",
            "description": "Ojas is a Pune food brand making stone-ground flours and traditional Maharashtrian food products since 2007 - jowar, bajra, ragi and rice flour, modak peeth, anarase pith and upwas flours - sold online with delivery across Pune and stocked in over 1,200 retail outlets.",
            "slogan": "शुद्ध आहार… शुद्ध विचार",
            "foundingDate": "2007",
            "email": "wecare@ojasaata.com",
            "telephone": "+91-8657781526",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Near Chhatrapati Shivaji Maharaj Udyan, Madhuban Society Lane No. 9, Old Sanghvi",
              "addressLocality": "Pune",
              "addressRegion": "MH",
              "postalCode": "411027",
              "addressCountry": "IN"
            },
            "areaServed": { "@type": "City", "name": "Pune" },
            "sameAs": ["https://www.instagram.com/ojas.aata/"],
            "hasMerchantReturnPolicy": {
              "@type": "MerchantReturnPolicy",
              "applicableCountry": "IN",
              "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
              "merchantReturnDays": 3,
              "returnMethod": "https://schema.org/ReturnByMail",
              "returnFees": "https://schema.org/FreeReturn",
              "merchantReturnLink": "https://www.ojasaata.com/refunds"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.ojasaata.com/#website",
            "name": "Ojas",
            "alternateName": ["Ojas Aata", "ojasaata.com"],
            "url": "https://www.ojasaata.com/",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://www.ojasaata.com/#organization" }
          }
        ]
      }
    </script>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <!-- The arrival screen draws the logo on its very first frame, so it is fetched with the page
         rather than discovered after the stylesheet. Unlike a hero picture (see the note below),
         this is never a wasted request: the header shows this same file on every page. -->
    <link rel="preload" as="image" href="images/logo.png" fetchpriority="high" />
    <!-- Without JavaScript nothing would ever take the arrival screen away, and it would sit over
         the text below for good. -->
    <noscript><style>#ojas-arrival { display: none; }</style></noscript>
    <!-- THERE IS DELIBERATELY NO HERO PRELOAD HERE ANY MORE.

         There used to be one, for /images/hero-banner-1280.webp, and its reasoning was sound while
         the hero was a fixed picture in the bundle: the browser cannot discover the largest paint
         on the home page until Angular has booted and rendered the home route, so naming it in the
         markup bought the whole cost of that bootstrap.

         It stopped being true the moment the owner published hero slides of their own. Verified
         against production on 2026-09-07: /api/hero-slides returns two admin-uploaded slides, so
         the shipped poster is not what anybody sees, and the preload was fetching ~190KB of a
         picture that is never drawn - on EVERY page load, product pages and checkout included,
         competing for bandwidth with the image that actually is the largest paint. A preload of
         the wrong file is worse than no preload at all.

         What replaces it: the first hero slide's <img> already carries fetchpriority="high" and a
         srcset (see home-hero.html), and /api/media responses are now cacheable at Vercel's edge
         (see MediaController), so the real picture is prioritised the moment it is known and comes
         from the edge rather than from the API instance.

         Still true after the September 2026 redesign: the owner's posters are the hero's picture
         again, in the carousel window at the top of the hero card (home-posters), and which
         poster comes first is only known once the API answers. Even a fixed picture would not
         belong here: this file is served for every route, so a preload charges product pages and
         checkout for a picture only the home page draws, and limiting it to "/" needs an inline
         script the CSP in vercel.json does not allow without a hash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Phone verification pulls the MSG91 widget, which in turn pulls hCaptcha from two further
         origins. Left to discover themselves, those are three cold DNS+TLS handshakes happening
         at the exact moment the customer is waiting on a "Send code" button. dns-prefetch rather
         than preconnect for the hCaptcha pair: only a fraction of visitors ever register, and a
         held-open connection to an origin most of them never use is a cost on every page. -->
    <link rel="preconnect" href="https://verify.msg91.com" />
    <link rel="dns-prefetch" href="https://newassets.hcaptcha.com" />
    <link rel="dns-prefetch" href="https://hcaptcha.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- Styles the noscript fallback only. Inline rather than in the stylesheet because the app's
         CSS is a separate request that a reader with no JavaScript will never make. -->
    <style>
      .boot-shell {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
        text-align: center;
        font-family: 'Poppins', 'Roboto', system-ui, sans-serif;
        color: #3a2f28;
        line-height: 1.7;
      }
      .boot-logo {
        display: block;
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .boot-shell h1 {
        font-size: 1.4rem;
      }
      .boot-shell a {
        color: #b3541e;
      }
      /* THE ARRIVAL - the one screen a visitor sees before the shop, in the manner of
         zerotoone.ai (the owner's pick, September 2026): a dark ground, the Ojas mark, and a single
         thin line drawing out while the app downloads. Drawn by this HTML alone, so it is there
         on the first frame; on 3G that covers what used to be seconds of blank white page.

         It replaces two things that used to play one after the other - a cream splash here and a
         separate intro the app drew on top of it. Now the app takes this same screen over
         (components/site-intro): on the first page of a visit the mark glides up into the header
         logo while the dark dissolves; on any other load it simply fades once the page is drawn.

         The mark is logo.png cropped to its orange oval. The small motto arching over the oval is
         dark maroon, drawn for a light background, and would read as a smudge here. */
      .arrival {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        /* A load that has gone wrong must never leave a customer stuck behind this screen. */
        animation: arrival-safety 0.4s ease 20s forwards;
      }
      .arrival-ground {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #24160d 0%, #150e09 55%, #0d0906 100%);
      }
      /* The mark is the logo's orange oval alone: a window exactly the oval's size - 217 x 143 of
         the 330 x 210 file, its box starting at (56, 50), measured from the file's pixels - and
         clipped to the oval's own shape. A square crop either cut the top off the oval or let the
         ends of the maroon motto, which curve down beside it, show as crumbs in its corners; the
         motto never enters the oval itself, so the ellipse takes it away cleanly.

         Sized to stay close to the file's own resolution: the oval is 217px wide in the only logo
         there is, and a phone draws two or three device pixels per CSS pixel. */
      .arrival-mark {
        position: relative;
        display: block;
        width: clamp(150px, 40vw, 190px);
        aspect-ratio: 217 / 143;
        overflow: hidden;
        clip-path: ellipse(50% 50% at 50% 50%);
        transform-origin: 0 0;
      }
      .arrival-mark img {
        display: block;
        /* The file at the scale where its oval fills the window (330 / 217 of the width), moved
           up and left so the oval's box sits exactly on the window. Margins in percent are of
           the window's width: 50 / 217 and 56 / 217. */
        width: 152.07%;
        max-width: none;
        height: auto;
        margin: -23.04% 0 0 -25.81%;
        opacity: 0;
        animation: arrival-mark-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      .arrival-line {
        position: relative;
        display: block;
        width: min(64vw, 300px);
        height: 1px;
        background: linear-gradient(
          90deg,
          rgba(247, 201, 139, 0) 0%,
          rgba(247, 201, 139, 0.8) 50%,
          rgba(247, 201, 139, 0) 100%
        );
        transform: scaleX(0);
        animation: arrival-line-draw 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      }
      @keyframes arrival-mark-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Most of the way, then it waits: the app finishes the line when the page is ready. */
      @keyframes arrival-line-draw {
        to {
          transform: scaleX(0.72);
        }
      }
      @keyframes arrival-safety {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arrival-mark img {
          animation: none;
          opacity: 1;
        }
        .arrival-line {
          animation: none;
          transform: scaleX(0.72);
        }
      }
    </style>
  </head>
  <body>
    <!-- The arrival screen (styled above). It sits OUTSIDE app-root on purpose: Angular empties
         app-root the moment it starts, which would snap this away mid-draw. Out here the app can
         take the same screen over and end it properly - see components/site-intro. Decorative,
         so hidden from assistive technology. -->
    <div id="ojas-arrival" class="arrival" aria-hidden="true">
      <span class="arrival-ground"></span>
      <span class="arrival-mark"
        ><img src="images/logo.png" alt="" width="330" height="210" fetchpriority="high" decoding="async"
      /></span>
      <span class="arrival-line"></span>
    </div>

    <!-- No text inside app-root. An earlier version put the business description here, where it
         rendered as a wall of unstyled text for the moments before Angular booted - a poor first
         impression on every single visit.

         The noscript block below carries that text without that cost. Its content is present in
         the HTML as served, so anything that does not execute JavaScript still reads it -
         crawlers, link previewers, and the payment gateway's compliance check that previously
         rejected this domain as "inactive / not live" for having a literally empty body. A browser
         with JavaScript on never renders it, so a real customer sees only the app.

         Do not "simplify" this away: without it the served HTML has zero visible text again. -->
    <app-root></app-root>

    <noscript>
      <div class="boot-shell">
        <span class="boot-logo">ओजस्</span>

        </p>
        <p>
          This shop needs JavaScript to run. Please enable it, or contact us directly and we will

        </p>
        <p>
          Phone: <a href="tel:+918657781526">+91 8657781526</a><br />
          <!-- A literal @, not the &#64; entity used in Angular templates (where @ starts control
               flow). This file is plain HTML, and a crawler reading the raw source should find a
               real address rather than an escape sequence. -->
          Email: <a href="mailto:wecare@ojasaata.com">wecare@ojasaata.com</a><br />
          Asha Marketing, Near Chhatrapati Shivaji Maharaj Udyan, Madhuban Society Lane No. 9,
          Old Sanghvi, Pune – 411027, Maharashtra, India<br />
          Instagram: <a href="https://www.instagram.com/ojas.aata/">@ojas.aata</a>

        <p>
          <a href="/contact">Contact Us</a> ·
          <a href="/terms">Terms and Conditions</a> ·
          <a href="/refunds">Refunds and Cancellations</a> ·
          <a href="/privacy">Privacy Policy</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
