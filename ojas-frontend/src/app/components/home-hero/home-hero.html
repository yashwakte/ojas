<!-- HERO — a full-bleed stage, not a framed picture.
     It used to render as a 1020px-wide rounded card floating in a cream page, which is what
     made the first screenful read as a slide deck rather than a storefront. It now fills the
     viewport edge to edge and top to bottom, and the call to action lives inside it instead of
     in a separate band below, so the first screen is one thing rather than three stacked strips.

     The artwork is 1699x926 (1.835:1) — the client's own composed poster, headline and all.
     A landscape desktop viewport is close enough to that shape for `cover` to trim only a
     little, and the trim is aimed away from the headline (see object-position in the SCSS).
     Phones are the other way round entirely, so below 901px the image keeps its own shape and
     the copy takes the space underneath — cropping a poster with the wordmark and eighteen pack
     shots baked into it down to a portrait window would throw away the picture.

     It ships as a WebP ladder rather than one big file: a phone downloads the 640px version
     (~48KB), a desktop the 1280px one (~142KB). width/height are the artwork's intrinsic size —
     they don't constrain the rendered size, they let the browser reserve the right shape before
     the picture arrives so the page below never jumps. fetchpriority + the preload in index.html
     start the download before Angular has booted. -->
<section
  class="hero"
  appHeroParallax
  [class.hero--open]="open()"
  [class.hero--revealed]="revealed()"
>
  <!-- Depth, in three cheap layers that drift against each other as the pointer moves and the
       page scrolls. A hero that holds still while everything around it moves is the thing that
       reads as flat; a hero with even slight internal parallax reads as a space. -->
  <div class="hero-atmos" aria-hidden="true">
    <span class="hero-bloom hero-bloom--warm"></span>
    <span class="hero-bloom hero-bloom--sage"></span>
    <span class="hero-grain"></span>
  </div>

  <div class="hero-stage">
    <!-- There is deliberately no second, blurred copy of the poster behind this one. An
         out-of-focus fill used to sit here to hide the fact that a 1.835:1 banner cannot fill
         a window of any other shape. It was the wrong answer twice over: it read as a smear
         behind the buttons, and it cost a second decode plus a 46px blur pass on every frame
         of the hero's parallax. The margins are simply the hero's own warm gradient now. -->
    <div class="hero-art">
      <picture class="hero-art-main">
        <source
          type="image/webp"
          srcset="
            /images/hero-banner-640.webp   640w,
            /images/hero-banner-960.webp   960w,
            /images/hero-banner-1280.webp 1280w,
            /images/hero-banner-1600.webp 1600w
          "
          sizes="100vw"
        />
        <img
          src="/images/hero-banner-1280.jpg"
          alt="Ojas - A Culinary Journey Through Generations"
          class="hero-banner-img"
          width="1699"
          height="926"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
    </div>

    <!-- THE DOORS. Two panels hinged on the outer edges of the stage that swing open in real
         perspective — rotateY about a hinge, not a flat slide — so they pass through the
         viewer's space on the way out and the artwork is revealed from behind rather than
         from under. The seam between them carries a line of light that widens as they part,
         and the artwork behind starts pushed back and settles forward as they clear, which is
         what sells the depth: two things moving at different rates in the same volume.
         Pure flourish, so it is hidden from assistive tech. -->
    <div class="hero-doors" aria-hidden="true">
      <span class="hero-seam"></span>
      <div class="hero-door hero-door--left">
        <span class="hero-door-face"></span>
        <span class="hero-door-edge"></span>
      </div>
      <div class="hero-door hero-door--right">
        <span class="hero-door-face"></span>
        <span class="hero-door-edge"></span>
      </div>
      <div class="hero-mark">
        <span class="hero-mark-word">OJAS</span>
        <span class="hero-mark-rule"></span>
        <span class="hero-mark-tagline">शुद्ध आहार... शुद्ध विचार</span>
      </div>
    </div>

    <!-- A frosted panel that sits ON the photograph, blurring whatever it happens to be over.
         On desktop it floats near the foot of the full-bleed image; on phones, where covering
         the artwork would hide most of the product, it sits below it instead. Each line rises
         out of its own mask on a stagger once the doors are gone. -->
    <div class="hero-copy">
      <div class="hero-copy-panel">
        <div class="hero-cta">
          <a routerLink="/products" class="btn-primary btn-lg"
            >Explore Products <mat-icon>arrow_forward</mat-icon></a
          >
          <a routerLink="/register" class="btn-outline btn-lg">Join Our Journey</a>
        </div>
        <div class="trust-strip">
          <span><mat-icon>eco</mat-icon> 100% Natural</span>
          <span><mat-icon>verified</mat-icon> No Preservatives</span>
          <span><mat-icon>local_shipping</mat-icon> Fresh Delivery</span>
        </div>
      </div>
    </div>
  </div>

  <span class="hero-scroll-cue" aria-hidden="true">
    <span class="hero-scroll-rail"><span class="hero-scroll-dot"></span></span>
  </span>
</section>
