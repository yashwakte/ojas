<div class="qs-backdrop" (click)="close()"></div>

<div class="qs-sheet" role="dialog" aria-modal="true" aria-labelledby="qsTitle">
  <!-- Soft bloom behind the header. Depth is what keeps a plain white panel from reading as a
       system dialog; it is decorative and never takes a pointer event. -->
  <span class="qs-glow" aria-hidden="true"></span>
  <span class="qs-grip" aria-hidden="true"></span>

  <div class="qs-head">
    <div class="qs-product">
      @if (imageUrl(); as image) {
        <span class="qs-thumb"><img [src]="image" [alt]="" aria-hidden="true" /></span>
      }
      <span class="qs-titles">
        <strong id="qsTitle">{{ productName() }}</strong>
        @if (weight()) {
          <small>{{ weight() }}</small>
        }
      </span>
    </div>
    <button type="button" class="qs-close" (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <p class="qs-prompt">How many would you like?</p>

  <div class="qs-grid" role="radiogroup" aria-labelledby="qsTitle">
    @for (option of options(); track option; let i = $index) {
      <button
        type="button"
        class="qs-tile"
        role="radio"
        [class.selected]="option === value()"
        [attr.aria-checked]="option === value()"
        [disabled]="isLocked(option) || !isAvailable(option)"
        [title]="disabledReason(option)"
        [style.--qs-delay.ms]="i * 22"
        (click)="choose(option)"
      >
        {{ option }}
      </button>
    }
  </div>

  @if (outOfStockFrom(); as stock) {
    <p class="qs-note">
      <mat-icon>inventory_2</mat-icon>
      {{ stock }} left in stock
    </p>
  }
</div>
