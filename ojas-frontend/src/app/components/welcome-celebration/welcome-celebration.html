@if (celebration(); as c) {
  <div
    class="cel"
    [class.leaving]="leaving()"
    [class.still]="reducedMotion"
    [class.kind-register]="isNew()"
    [class.kind-login]="!isNew()"
    role="status"
    aria-live="polite"
    (click)="dismiss()"
  >
    <div class="cel-scrim"></div>

    @if (!reducedMotion) {
      <div class="cel-bloom" aria-hidden="true"></div>

      @if (isNew()) {
        <!-- Register: a fuller, warmer field for the one moment this ever happens. -->
        <canvas #moteCanvas class="cel-motes" aria-hidden="true"></canvas>
        <div class="cel-rings" aria-hidden="true">
          <span class="ring"></span>
          <span class="ring" style="animation-delay: 1070ms"></span>
          <span class="ring" style="animation-delay: 2140ms"></span>
        </div>
      } @else {
        <!-- Login: light travels around the disc, two hairlines frame it, and a drawn ring
             closes the moment. Layered rather than busy - each one is doing a different job. -->
        <div class="cel-halo" aria-hidden="true">
          <span class="halo"></span>
          <span class="halo halo-2"></span>
        </div>
        <div class="cel-beam" aria-hidden="true"></div>
        <div class="cel-orbit" aria-hidden="true">
          <svg viewBox="0 0 120 120" class="orbit-ring">
            <circle cx="60" cy="60" r="57" pathLength="100" />
          </svg>
        </div>
      }
    }

    <div class="cel-stage">
      <div class="emblem" aria-hidden="true">
        @if (isNew()) {
          <svg class="check" viewBox="0 0 32 32" fill="none">
            <path
              d="M8 16.5l5.5 5.5L24 11"
              pathLength="100"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <span class="monogram">{{ initial() }}</span>
          @if (!reducedMotion) {
            <span class="sheen" aria-hidden="true"></span>
          }
        }
      </div>

      <h2 class="cel-title">
        @for (word of headlineWords(); track $index) {
          <span class="w"><i [style.animation-delay.ms]="520 + $index * 75">{{ word }}</i></span>
        }
      </h2>

      <span class="cel-hair" aria-hidden="true"></span>
      <p class="cel-sub">{{ subtext() }}</p>
    </div>

    <span class="cel-hint" aria-hidden="true">Tap anywhere to continue</span>
  </div>
}
