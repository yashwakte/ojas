<section
  class="campaign-banner"
  [class.has-bg-image]="backgroundImageUrl()"
  [class.has-overlay-text]="hasOverlayText()"
  [class.is-preview]="preview()"
>
  @if (backgroundImageUrl()) {
    <div class="campaign-banner-media">
      <img
        class="campaign-banner-img"
        [src]="backgroundImageUrl()"
        [attr.fetchpriority]="priority() ? 'high' : null"
        [attr.loading]="priority() ? 'eager' : 'lazy'"
        decoding="async"
        alt=""
      />
    </div>
  }
  <div class="campaign-banner-inner">
    @if (title()) {
      <h2>{{ title() }}</h2>
    }
    @if (subtitle()) {
      <p>{{ subtitle() }}</p>
    }
    @if (ctaText()) {
      @if (preview()) {
        <span class="btn-white">{{ ctaText() }} <mat-icon>arrow_forward</mat-icon></span>
      } @else {
        <a [routerLink]="ctaLink() || '/products'" class="btn-white">
          {{ ctaText() }} <mat-icon>arrow_forward</mat-icon>
        </a>
      }
    }
  </div>
</section>
